<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="api-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="card-panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <filter id="api-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#api-bg)" />

  <!-- Subgrid Matrix Pattern -->
  <g opacity="0.06" stroke="#8b5cf6" stroke-width="1">
    <pattern id="api-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" />
    </pattern>
    <rect width="800" height="450" fill="url(#api-grid)" />
  </g>

  <!-- Accent Orbs -->
  <circle cx="680" cy="90" r="130" fill="#8b5cf6" opacity="0.12" filter="url(#api-glow)" />
  <circle cx="100" cy="360" r="110" fill="#06b6d4" opacity="0.1" filter="url(#api-glow)" />

  <!-- Main Container -->
  <rect x="25" y="25" width="750" height="400" rx="16" fill="url(#card-panel)" stroke="#334155" stroke-width="1.5" />

  <!-- Window Header Bar -->
  <path d="M 25 41 A 16 16 0 0 1 41 25 L 759 25 A 16 16 0 0 1 775 41 L 775 75 L 25 75 Z" fill="#0f172a" />
  <line x1="25" y1="75" x2="775" y2="75" stroke="#334155" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="50" cy="50" r="6" fill="#ef4444" opacity="0.85" />
  <circle cx="70" cy="50" r="6" fill="#f59e0b" opacity="0.85" />
  <circle cx="90" cy="50" r="6" fill="#10b981" opacity="0.85" />

  <!-- Title -->
  <text x="120" y="55" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="0.5">
    REST_API_CORE :: DJANGO + CELERY + REDIS CLUSTER
  </text>

  <!-- Live Status Badge -->
  <rect x="635" y="38" width="120" height="25" rx="12.5" fill="#064e3b" stroke="#10b981" stroke-width="1" />
  <circle cx="650" cy="50.5" r="4" fill="#34d399">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="662" y="55" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">99.98% UPTIME</text>

  <!-- Left Column: API Endpoint Pipeline & Security (x: 50 to 390) -->
  <rect x="50" y="95" width="335" height="310" rx="12" fill="#0b1329" stroke="#1e293b" stroke-width="1.5" />
  <text x="70" y="123" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">ACTIVE REST ENDPOINTS</text>
  <text x="310" y="123" fill="#a78bfa" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">v1.2</text>

  <!-- Endpoint 1 -->
  <g transform="translate(68, 140)">
    <rect width="300" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
    <rect x="10" y="14" width="45" height="20" rx="4" fill="#047857" />
    <text x="19" y="28" fill="#ffffff" font-family="monospace" font-size="10" font-weight="800">POST</text>
    <text x="65" y="27" fill="#f1f5f9" font-family="monospace" font-size="11" font-weight="600">/api/v1/auth/token/</text>
    <text x="65" y="40" fill="#94a3b8" font-family="monospace" font-size="9">JWT Token &amp; Refresh Rotate</text>
    <rect x="245" y="15" width="45" height="18" rx="4" fill="#065f46" />
    <text x="254" y="27" fill="#34d399" font-family="monospace" font-size="9" font-weight="700">200 OK</text>
  </g>

  <!-- Endpoint 2 -->
  <g transform="translate(68, 198)">
    <rect width="300" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
    <rect x="10" y="14" width="45" height="20" rx="4" fill="#1d4ed8" />
    <text x="23" y="28" fill="#ffffff" font-family="monospace" font-size="10" font-weight="800">GET</text>
    <text x="65" y="27" fill="#f1f5f9" font-family="monospace" font-size="11" font-weight="600">/api/v1/feed/ranked/</text>
    <text x="65" y="40" fill="#94a3b8" font-family="monospace" font-size="9">Algorithm Cache Layer (Redis)</text>
    <rect x="245" y="15" width="45" height="18" rx="4" fill="#065f46" />
    <text x="254" y="27" fill="#34d399" font-family="monospace" font-size="9" font-weight="700">18ms</text>
  </g>

  <!-- Endpoint 3 -->
  <g transform="translate(68, 256)">
    <rect width="300" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
    <rect x="10" y="14" width="45" height="20" rx="4" fill="#6d28d9" />
    <text x="19" y="28" fill="#ffffff" font-family="monospace" font-size="10" font-weight="800">POST</text>
    <text x="65" y="27" fill="#f1f5f9" font-family="monospace" font-size="11" font-weight="600">/api/v1/posts/media/</text>
    <text x="65" y="40" fill="#94a3b8" font-family="monospace" font-size="9">Celery Task: Async Resize</text>
    <rect x="245" y="15" width="45" height="18" rx="4" fill="#4c1d95" />
    <text x="251" y="27" fill="#c084fc" font-family="monospace" font-size="9" font-weight="700">ASYNC</text>
  </g>

  <!-- Key Metrics Footer -->
  <g transform="translate(68, 318)">
    <rect width="300" height="70" rx="8" fill="#141f36" stroke="#253556" stroke-width="1" />
    <text x="15" y="25" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">AUTH PROTOCOL</text>
    <text x="15" y="48" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800">JWT + OAuth2</text>
    <line x1="130" y1="12" x2="130" y2="58" stroke="#334155" stroke-width="1" />
    <text x="145" y="25" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">RATE LIMITING</text>
    <text x="145" y="48" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800">100 req/min</text>
  </g>

  <!-- Right Column: Redis Caching & Celery Worker Metrics (x: 410 to 750) -->
  <rect x="410" y="95" width="340" height="310" rx="12" fill="#0b1329" stroke="#1e293b" stroke-width="1.5" />
  <text x="430" y="123" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">QUEUE &amp; CACHE PERFORMANCE</text>
  <text x="670" y="123" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">HEALTHY</text>

  <!-- Redis Cache Bar -->
  <g transform="translate(430, 145)">
    <rect width="300" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
    <text x="15" y="24" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">REDIS CACHE HIT RATIO</text>
    <text x="235" y="24" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">98.4%</text>
    <rect x="15" y="36" width="270" height="8" rx="4" fill="#334155" />
    <rect x="15" y="36" width="265" height="8" rx="4" fill="url(#cyan-glow)" />
    <text x="15" y="56" fill="#64748b" font-family="monospace" font-size="9">Sub-millisecond query offloading active</text>
  </g>

  <!-- Celery Worker Card -->
  <g transform="translate(430, 220)">
    <rect width="300" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
    <text x="15" y="24" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">CELERY BACKGROUND WORKERS</text>
    <text x="215" y="24" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800">4 CONCURRENT</text>
    <rect x="15" y="36" width="270" height="8" rx="4" fill="#334155" />
    <rect x="15" y="36" width="180" height="8" rx="4" fill="url(#purple-glow)" />
    <text x="15" y="56" fill="#64748b" font-family="monospace" font-size="9">0 task backlog | Auto-scaling ready</text>
  </g>

  <!-- Live Latency Waveform Graph -->
  <g transform="translate(430, 295)">
    <rect width="300" height="93" rx="8" fill="#141f36" stroke="#253556" stroke-width="1" />
    <text x="15" y="20" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">RESPONSE LATENCY PROFILE</text>
    <text x="230" y="20" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700">AVG: 24ms</text>
    
    <!-- Graph -->
    <path d="M 15 70 Q 50 65, 80 45 T 150 50 T 210 38 T 285 45" fill="none" stroke="#a855f7" stroke-width="2.2" />
    <path d="M 15 70 Q 50 65, 80 45 T 150 50 T 210 38 T 285 45 L 285 82 L 15 82 Z" fill="#8b5cf6" opacity="0.12" />
    <circle cx="210" cy="38" r="4" fill="#a855f7" stroke="#ffffff" stroke-width="1.5" />
    <text x="15" y="86" fill="#64748b" font-family="monospace" font-size="9">Throughput: 1,420 req/s | DB Pool: PostgreSQL</text>
  </g>
</svg>
